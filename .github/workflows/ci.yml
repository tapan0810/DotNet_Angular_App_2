name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore application
        run: dotnet restore DotNet_Angular_App_2.sln
      - name: Build application
        run: dotnet build DotNet_Angular_App_2.sln --configuration Release --no-restore
      - name: Restore tests
        run: dotnet restore tests/DotNet_Angular_App_2.Tests/DotNet_Angular_App_2.Tests.csproj
      - name: Test
        run: dotnet test tests/DotNet_Angular_App_2.Tests/DotNet_Angular_App_2.Tests.csproj --configuration Release --no-restore --verbosity normal

  angular:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DotNet_Angular_App_2_Frontend/UI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: DotNet_Angular_App_2_Frontend/UI/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --watch=false
