<div class="container mt-4">

    <!-- Page Header -->

    <div class="d-flex justify-content-between align-items-center mb-3">

        <h2>Student Management</h2>

        <button
            type="button"
            class="btn btn-success"
            (click)="openModal()">

            Add Student

        </button>

    </div>


    <!-- Error -->

    <div
        *ngIf="errorMessage"
        class="alert alert-danger">

        {{ errorMessage }}

    </div>


    <!-- Loading -->

    <div
        *ngIf="isLoading"
        class="alert alert-info">

        Loading students...

    </div>


    <!-- Student Table -->

    <table
        class="table table-bordered table-striped"
        *ngIf="!isLoading">

        <thead>

            <tr>

                <th>Id</th>

                <th>Name</th>

                <th>Grade</th>

                <th>Is Passed</th>

                <th class="text-center">
                    Action
                </th>

            </tr>

        </thead>


        <tbody>

            <!-- No records -->

            <tr *ngIf="students.length === 0">

                <td
                    colspan="5"
                    class="text-center">

                    No students found.

                </td>

            </tr>


            <!-- Records -->

            <tr
                *ngFor="let student of students">

                <td>
                    {{ student.id }}
                </td>

                <td>
                    {{ student.name }}
                </td>

                <td>
                    {{ student.grade }}
                </td>

                <td>

                    <span *ngIf="student.isPassed">
                        True
                    </span>

                    <span *ngIf="!student.isPassed">
                        False
                    </span>

                </td>

                <td class="text-center">

                    <button
                        type="button"
                        class="btn btn-primary me-2"
                        (click)="editStudent(student)">

                        Edit

                    </button>


                    <button
                        type="button"
                        class="btn btn-danger"
                        (click)="deleteStudent(student.id)">

                        Delete

                    </button>

                </td>

            </tr>

        </tbody>

    </table>

</div>


<!-- ========================= -->
<!-- ADD / EDIT MODAL -->
<!-- ========================= -->

<div
    id="myModal"
    class="modal"
    tabindex="-1">

    <div class="modal-dialog">

        <div class="modal-content">


            <!-- Modal Header -->

            <div class="modal-header bg-info">

                <h4 class="modal-title">

                    {{ isEditMode ? 'Edit Student' : 'Add Student' }}

                </h4>

                <button
                    type="button"
                    class="btn-close"
                    (click)="closeModal()">

                </button>

            </div>


            <!-- Modal Body -->

            <div class="modal-body">

                <form
                    [formGroup]="classForm"
                    (ngSubmit)="saveStudent()">


                    <!-- Name -->

                    <div class="mb-3">

                        <label class="form-label">
                            Name
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            placeholder="Enter Name"
                            formControlName="name">

                        <div
                            class="text-danger"
                            *ngIf="
                                classForm.get('name')?.invalid &&
                                classForm.get('name')?.touched
                            ">

                            Name is required.

                        </div>

                    </div>


                    <!-- Grade -->

                    <div class="mb-3">

                        <label class="form-label">
                            Grade
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            placeholder="Enter Grade"
                            formControlName="grade">

                        <div
                            class="text-danger"
                            *ngIf="
                                classForm.get('grade')?.invalid &&
                                classForm.get('grade')?.touched
                            ">

                            Grade is required.

                        </div>

                    </div>


                    <!-- Is Passed -->

                    <div class="form-check mb-3">

                        <input
                            type="checkbox"
                            class="form-check-input"
                            id="isPassed"
                            formControlName="isPassed">

                        <label
                            class="form-check-label"
                            for="isPassed">

                            Passed

                        </label>

                    </div>


                    <!-- Modal Footer -->

                    <div class="modal-footer">

                        <button
                            type="submit"
                            class="btn btn-dark">

                            {{ isEditMode ? 'Update' : 'Save' }}

                        </button>


                        <button
                            type="button"
                            class="btn btn-danger"
                            (click)="closeModal()">

                            Close

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>
